name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests, typecheck & Expo dependency check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check Expo dependency versions
        run: npx expo install --check
